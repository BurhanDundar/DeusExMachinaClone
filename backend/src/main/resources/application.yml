spring:
  application:
    name: northline-store-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:northline}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:northline}
    password: ${DB_PASSWORD:northline_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storefront-url: ${STOREFRONT_URL:http://localhost:3000}
  email:
    resend-api-key: ${RESEND_API_KEY:${EMAIL_PROVIDER_KEY:}}
    from: ${EMAIL_FROM:Binks Machina <onboarding@resend.dev>}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  auth:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-attempt-window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
    rate-limit-cleanup-ms: ${AUTH_RATE_LIMIT_CLEANUP_MS:900000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  orders:
    reservation-minutes: ${ORDER_RESERVATION_MINUTES:30}
    max-pending-per-hour: ${ORDER_MAX_PENDING_PER_HOUR:5}
    expiration-check-ms: ${ORDER_EXPIRATION_CHECK_MS:60000}
    shipping-flat-fee: ${SHIPPING_FLAT_FEE:79.90}
    free-shipping-threshold: ${FREE_SHIPPING_THRESHOLD:1500.00}

logging:
  level:
    com.northline.store: INFO
