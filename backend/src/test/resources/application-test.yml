spring:
  datasource:
    url: jdbc:h2:mem:northline;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
app:
  jwt:
    secret: test-secret-that-is-longer-than-thirty-two-bytes-12345
    access-token-minutes: 15
    refresh-token-days: 30
  cookie:
    secure: false
    same-site: Lax
  cors:
    allowed-origins: http://localhost:3000
logging:
  level:
    root: WARN
