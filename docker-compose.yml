services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-northline}
      POSTGRES_USER: ${DB_USER:-northline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-northline_dev}
    ports:
      - "5432:5432"
    volumes:
      - northline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-northline}
      DB_USER: ${DB_USER:-northline}
      DB_PASSWORD: ${DB_PASSWORD:-northline_dev}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-production-1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  northline-postgres:
